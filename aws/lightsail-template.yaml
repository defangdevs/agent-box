AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  agent-box on AWS Lightsail - the template the README's 1-click Launch
  buttons point at. One Lightsail instance boots the stock Ubuntu 24.04
  blueprint and STAYS Ubuntu: Nix is installed as a plain package manager,
  the pinned runtime profile brings the agent CLIs, tmux, ttyd and Caddy,
  and `agentbox apply` renders the users, units, sudoers, Caddyfile and
  first-boot secrets. No nixos-infect, no root-filesystem relabel, and no
  reboot - so first boot is minutes rather than tens of minutes, and the
  Lightsail console's browser SSH keeps working (nothing lustrates /home).
  This replaced the nixos-infect template that used to carry this filename
  (issues #154 Phase 4 and #390).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Box
        Parameters:
          - Agent
          - UserName
          - WebPassword
      - Label:
          default: Size
        Parameters:
          - BundleId
      - Label:
          default: Agent instructions
        Parameters:
          - AgentsMd
      - Label:
          default: Advanced
        Parameters:
          - AgentBoxFlakeRef
          - NixInstallerUrl
          - AllowCidr
          - DebugSsh
    # The console renders these instead of the raw parameter names on the
    # 1-click form, which is the only UI most launches ever see.
    ParameterLabels:
      Agent:
        default: Agent CLI
      UserName:
        default: Linux user the agent runs as
      WebPassword:
        default: Web terminal password (16-64 chars - save it, AWS masks it)
      BundleId:
        default: Lightsail bundle (size / price)
      AgentsMd:
        default: Extra AGENTS.md text seeded for the agent
      AgentBoxFlakeRef:
        default: agent-box flake reference (pin to a commit to freeze the box)
      NixInstallerUrl:
        default: Nix installer
      AllowCidr:
        default: IPv4 CIDR allowed to reach 443 (and 22 when DebugSsh=true)
      DebugSsh:
        default: Open port 22 for SSH as "ubuntu" with the Lightsail default key

Parameters:
  UserName:
    Type: String
    Default: agent
    AllowedPattern: '[a-z_][a-z0-9_-]{0,31}'
    Description: >-
      Linux user that owns the agent sessions, and the login name for the
      browser terminal.

  WebPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 64
    AllowedPattern: '[A-Za-z0-9._~-]{16,64}'
    Description: >-
      Password for the browser terminal (16-64 chars of A-Z a-z 0-9 . _ ~ -).
      Hashed with argon2id on first boot; the plaintext is never written to
      disk. Change it later from the box's own settings page.

  Agent:
    Type: String
    Default: claude
    AllowedValues: [claude, codex]
    Description: Which agent CLI the box's initial session runs.

  # The picker annotates each value with vCPU/RAM/price because the
  # CloudFormation console renders AllowedValues verbatim - there is no
  # separate label field. The Lightsail API only ever sees the first token:
  # the Instance resource splits on the first space. No commas in the values,
  # so `ParameterKey=BundleId,ParameterValue=...` CLI shorthand still parses.
  #
  # 2 GiB is the floor on purpose. The sub-2-GiB bundles (nano_3_0 at 0.5 GiB,
  # micro_3_0 at 1 GiB) do complete a live launch on the swap file the
  # bootstrap creates, but they leave nothing for the work the box exists to
  # do: an agent CLI plus a language server plus a build is what actually runs
  # here, not the bootstrap.
  BundleId:
    Type: String
    Default: small_3_0 (2 vCPU / 2 GiB / 60 GiB SSD / $12 mo)
    AllowedValues:
      - small_3_0 (2 vCPU / 2 GiB / 60 GiB SSD / $12 mo)
      - medium_3_0 (2 vCPU / 4 GiB / 80 GiB SSD / $24 mo)
      - large_3_0 (2 vCPU / 8 GiB / 160 GiB SSD / $44 mo)
      - xlarge_3_0 (4 vCPU / 16 GiB / 320 GiB SSD / $84 mo)
    Description: >-
      Lightsail bundle (the id before the parenthesis; specs shown for
      convenience). The flat price bundles compute, the SSD, the attached
      static IPv4 and a multi-TB/month transfer allowance - no separate EBS
      or public-IPv4 line items like the EC2 template. All are dual-stack
      (IPv4 + IPv6). small_3_0 (2 GiB) is the default and the smallest
      offered: it matches a t4g.small EC2 box and runs a single agent
      comfortably, since this path has no closure build and no
      nixos-rebuild. Pick medium_3_0 (4 GiB) for parallel sessions or heavy
      builds. Lightsail disks are fixed by the bundle: to grow later you
      snapshot and restore onto a larger bundle (there is no live
      volume-resize like EBS).

  AgentsMd:
    Type: String
    Default: |
      ## This box (AWS / Lightsail)

      - This is an AWS Lightsail instance running Ubuntu with agent-box
        installed through Nix. The SSD persists but RAM does not: a reboot or
        stop/start loses the live tmux session, so save working context to
        disk under your home. A static IP is attached, so the public address
        (and your URL) survives a stop/start.
      - Your URL is derived from the instance's static IP via sslip.io. It is
        stable, but always read $AGENT_BOX_URL rather than hard-coding it.
      - The base OS is ordinary Ubuntu: apt and unattended-upgrades own it,
        and the Lightsail console's browser SSH works (it logs in as
        "ubuntu"). agent-box itself never calls apt - it lives in the Nix
        profile /nix/var/nix/profiles/agent-box.
      - Low on disk? Lightsail bundles have a fixed SSD - snapshot the
        instance and restore it onto a larger bundle to grow. Scheduled nix
        garbage collection reclaims store space in the meantime.
    Description: >-
      Deployment-specific instructions APPENDED to the box's AGENTS.md (the
      agent's standing instructions), below the built-in platform guide.
      Empty = just that guide.

  AgentBoxFlakeRef:
    Type: String
    Default: github:defangdevs/agent-box
    Description: >-
      Flake reference the runtime profile is installed from. Pin it to a
      revision (github:defangdevs/agent-box/<sha>) for a reproducible box;
      the bare ref tracks the default branch.

  NixInstallerUrl:
    Type: String
    Default: https://install.determinate.systems/nix
    Description: >-
      Nix installer. The Determinate installer is used deliberately: it
      supports SELinux (so the same script serves RHEL), survives distro
      upgrades, and enables flakes out of the box.

  AllowCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '\d{1,3}(\.\d{1,3}){3}/\d{1,2}'
    Description: Source range allowed to reach the terminal (and SSH).

  DebugSsh:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Open port 22 for the Lightsail default key. Unlike the nixos-infect
      template, SSH here keeps working exactly as the blueprint left it -
      nothing wipes /home or /root - so this is an ordinary Ubuntu box to
      debug.

Conditions:
  OpenSsh: !Equals [!Ref DebugSsh, 'true']

Resources:
  Instance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Ref AWS::StackName
      AvailabilityZone: !Select [0, !GetAZs '']
      BlueprintId: ubuntu_24_04
      BundleId: !Select [0, !Split [' ', !Ref BundleId]]
      Networking:
        Ports:
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            Cidrs: [!Ref AllowCidr]
            Ipv6Cidrs: ['::/0']
          - !If
            - OpenSsh
            - FromPort: 22
              ToPort: 22
              Protocol: tcp
              Cidrs: [!Ref AllowCidr]
            - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
      UserData:
        Fn::Sub:
          - |
            #!/usr/bin/env bash
            # agent-box native bootstrap (issue #154 Phase 4). Runs once, as
            # root, via Lightsail's launch-script mechanism.
            #
            # NOTE ON THE SHELL, learned the hard way: Lightsail PREPENDS its
            # own "#!/bin/sh" preamble (the instance SSH CA block) to this
            # launch script, so the shebang above is only a comment in the
            # middle of the file cloud-init actually runs, and the whole
            # thing executes under dash. The nixos-infect template died
            # exactly there - "set: Illegal option -o pipefail", 19 seconds
            # into first boot, on every launch it ever had. Re-exec under
            # bash first, so the dialect never depends on what AWS puts in
            # front of us. Re-running AWS's preamble is harmless (it
            # re-registers the same CA key). scripts/check_lightsail_userdata.py
            # keeps this guard in place.
            #
            # This is also why the payload is a shell script and not the
            # "#cloud-config" the Phase 4 design sketched: on Lightsail the
            # launch script is concatenated INTO a shell script, so a YAML
            # cloud-config document could never be parsed as one. A native
            # EC2 template can use #cloud-config - nothing is prepended there.
            if [ -z "${!BASH_VERSION:-}" ]; then exec /bin/bash "$0" "$@"; fi
            set -euxo pipefail
            exec > >(tee /var/log/agent-box-bootstrap.log) 2>&1

            # cloud-init runs the launch script with an almost empty
            # environment - no HOME. Nix's own profile script dereferences
            # $HOME unguarded (`NIX_LINK=$HOME/.nix-profile`), so sourcing it
            # under `set -u` aborted the whole bootstrap with "HOME: unbound
            # variable" 40 s into first boot, on real hardware. Everything
            # after this line also wants a HOME: `nix profile add` writes
            # ~/.cache/nix, and `gh`/the agent CLIs read ~/.config.
            export HOME="${!HOME:-/root}"

            # Swap. There is no closure build on this path, but substituting
            # the profile peaks high enough to be worth carrying on the
            # smallest bundle offered, and the agent's own work later leans
            # on it too.
            if ! swapon --show=NAME --noheadings | grep -qx /agent-box-swap; then
              fallocate -l 2G /agent-box-swap || \
                dd if=/dev/zero of=/agent-box-swap bs=1M count=2048
              chmod 600 /agent-box-swap
              mkswap /agent-box-swap
              swapon /agent-box-swap
              echo '/agent-box-swap none swap sw 0 0' >> /etc/fstab
            fi

            # Nix as a package manager. Not NixOS: this box stays Ubuntu, so
            # apt keeps owning the base OS (and unattended-upgrades keeps
            # patching it). `agentbox apply` never calls apt.
            curl -fsSL "${NixInstallerUrl}" \
              | sh -s -- install linux --no-confirm --determinate
            # `set +u` around a script we do not own: the installer's profile
            # snippet is free to reference whatever the next release wants,
            # and it must not be able to abort the bootstrap again.
            set +u
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
            set -u

            # The runtime profile: payloads, tools, agent CLIs, shared assets.
            # A system profile, so `nix profile rollback --profile ...` is the
            # undo button and no user's own profile is touched.
            nix profile install \
              --profile /nix/var/nix/profiles/agent-box \
              "${AgentBoxFlakeRef}#runtime"
            AGENTBOX=/nix/var/nix/profiles/agent-box/bin/agentbox

            # The box's declared state. Everything host-specific the renderer
            # needs, and nothing it can discover for itself: `domain: auto`
            # tells --first-boot to settle the public IPv4 and derive the
            # sslip.io hostname from it.
            install -d -m 0755 /etc/agent-box
            cat > /etc/agent-box/config.yaml <<'AGENTBOX_CONFIG'
            domain: auto
            agents: [claude, codex]
            defaultAgent: @AGENT@
            web:
              enable: true
            users:
              @USER@:
                root: true
                sessions:
                  main:
                    agent: @AGENT@
            AGENTBOX_CONFIG
            sed -i "s|@AGENT@|${Agent}|g; s|@USER@|${UserName}|g" \
              /etc/agent-box/config.yaml

            # Extra standing instructions for the agent, if the stack gave any.
            install -d -m 0755 /etc/agent-box-guides
            cat > /etc/agent-box-guides/AGENTS.stack.md <<'AGENTBOX_AGENTSMD'
            ${AgentsMd}
            AGENTBOX_AGENTSMD

            # Render and start everything. The password reaches the renderer
            # through the environment and is hashed with argon2id, so it is
            # never written to the box's disk in the clear. It IS part of the
            # instance's launch script, though, which anyone holding
            # lightsail:GetInstance on this account can read - same exposure
            # as the infect template had, and the reason the settings page
            # can change the password afterwards.
            # set +x for this one command: the trace this script runs under
            # writes every expanded word to /var/log/agent-box-bootstrap.log,
            # so leaving it on put the plaintext password in a world-readable
            # log on the box - which is precisely what "never written to disk"
            # was supposed to mean.
            set +x
            AGENT_BOX_WEB_PASSWORD=${WebPasswordPlain} \
              "$AGENTBOX" apply --first-boot --settle-delay 60
            set -x

            # Only now, with the box actually configured and the units up,
            # tell CloudFormation the stack succeeded. A failed apply exits
            # non-zero above (set -e), leaves the handle unsignalled, and the
            # stack rolls back instead of reporting a box that does not work.
            "$AGENTBOX" signal "${FirstBootHandle}"
          - WebPasswordPlain: !Ref WebPassword
            FirstBootHandle: !Ref FirstBootHandle

  # Static IPv4 - free while attached, and stable across a stop/start, so the
  # derived sslip.io hostname keeps resolving. The launch script discovers the
  # address at runtime rather than referencing this resource, so there is no
  # dependency cycle.
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: !Sub '${AWS::StackName}-ip'
      AttachedTo: !Ref Instance

  FirstBootHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  # First-boot gate. Much tighter than the nixos-infect template's 45 minutes:
  # installing Nix plus substituting a profile is minutes, and there is no
  # reboot to wait through.
  FirstBootDone:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref FirstBootHandle
      Count: 1
      Timeout: '1200'

Outputs:
  WebURL:
    Description: >-
      Browser terminal. Sign in with the UserName and the WebPassword chosen
      at deployment time. The first load waits on Caddy's ACME certificate.
      (The URL deliberately carries no user@ prefix: Chrome answers the auth
      challenge with URL userinfo plus an EMPTY password, and credentials
      typed into the prompt cannot override the URL-embedded identity.)
    Value: !Sub
      - 'https://${Host}.sslip.io/${UserName}/'
      - Host: !Join ['-', !Split ['.', !GetAtt StaticIp.IpAddress]]

  RemoteControlSession:
    Description: >-
      Claude Remote Control session name. After finishing `claude login` once
      in the browser terminal, the Claude desktop and mobile apps can drive
      this session. Only meaningful when Agent=claude.
    Value: !Sub
      - '${UserName}-main@${Host}.sslip.io'
      - Host: !Join ['-', !Split ['.', !GetAtt StaticIp.IpAddress]]

  PublicAddress:
    Description: Attached static IPv4 address.
    Value: !GetAtt StaticIp.IpAddress

  SshCommand:
    Description: >-
      Debug access with the Lightsail default key (Account -> SSH keys in the
      console). This box is ordinary Ubuntu, so the console's browser SSH
      works too - it logs in as "ubuntu", which the native path never
      removes.
    Value: !Sub
      - 'ssh -i <lightsail-default-key.pem> ubuntu@${Ip}'
      - Ip: !GetAtt StaticIp.IpAddress

  BootstrapLog:
    Description: Where first-boot output lands if the stack times out.
    Value: /var/log/agent-box-bootstrap.log
