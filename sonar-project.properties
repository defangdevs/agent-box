# Connection and project identity are configured in repository Actions settings.
sonar.projectName=agent-box
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests

# Analyze maintained sources once, not their assembled or rendered copies.
sonar.exclusions=tests/**,modules/agent-box.nix,modules/src/vendor/**,deploy/azure/agent-box.json
sonar.test.exclusions=tests/golden/**,tests/native/expected/**

# The native configuration CLI is Python without a .py extension.
sonar.lang.patterns.py=**/*.py,bin/agentbox
