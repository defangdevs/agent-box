# Generated by `nix run .#update-native-config` from the golden web
# configuration (tests/spec.nix) — do not edit. Same box as
# config.json, spelled in YAML: the shape cloud-init writes.
agents:
- claude
- codex
codexFullAccess: true
defaultAgent: claude
domain: golden.example.org
protectMemory: true
repo: defangdevs/agent-box
rev: '0000000000000000000000000000000000000000'
sudoAllowlist:
- /run/current-system/sw/bin/systemctl reload caddy.service
users:
  agent:
    root: true
    sessions:
      main: {}
      review:
        agent: codex
        cwd: /home/agent/agent-box
  robot:
    agent: codex
    environment:
      AGENT_BOX_EXTRA: '1'
    environmentFiles:
    - /etc/agent-box/robot.extra.env
    sessions:
      main:
        agent: codex
web:
  enable: true
webhook:
  enable: true
  hookSessionArgs: []
  repo: defangdevs/local-channels
  script: /etc/agent-box/webhook.py
