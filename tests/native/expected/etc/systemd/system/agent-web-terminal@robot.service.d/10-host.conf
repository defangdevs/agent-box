[Unit]

[Service]
Environment="PATH=@PROFILE@/bin"
Environment="AGENT_BOX_SESSION_BIN=/usr/local/bin/agent-box-session"
ExecStart=
ExecStart=@PROFILE@/bin/ttyd --writable --url-arg -p 7682 -i 127.0.0.1 -b /robot -t disableLeaveAlert=true -t titleFixed=robot@golden.example.org @PROFILE@/bin/agent-box-attach
