[Unit]

[Service]
Environment="PATH=@PROFILE@/bin"
Environment="AGENT_BOX_AGENTS=claude,codex,shell"
Environment="AGENT_BOX_DEFAULT_AGENT=claude"
Environment="AGENT_BOX_REPO=defangdevs/agent-box"
Environment="AGENT_BOX_REV=1111111111111111111111111111111111111111"
Environment="AGENT_BOX_SYSTEMCTL=/usr/bin/systemctl"
Environment="AGENT_BOX_TMUX_BIN=@PROFILE@/bin/tmux"
Environment="AGENT_BOX_UPDATE_CMD=/usr/bin/sudo -n /usr/bin/systemctl start --no-block agent-box-update.service"
Environment="AGENT_BOX_UPDATE_UNIT=agent-box-update.service"
ExecStart=
ExecStart=@PROFILE@/bin/agent-box-settings
