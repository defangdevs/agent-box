name: Publish CFN template to S3

on:
  push:
    branches: [ master ]
    paths:
      - 'aws/template.yaml'
      - 'aws/lightsail-template.yaml'
      - '.github/workflows/publish-template.yml'
  workflow_dispatch:

concurrency:
  group: publish-template
  cancel-in-progress: false

permissions:
  id-token: write   # for OIDC AssumeRoleWithWebIdentity
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Fork this repo? Configure these under Settings > Secrets and variables >
    # Actions > Variables (repo-level, not secrets — none of these are sensitive).
    # See aws/README.md.
    # Fork? Override with a repo-scoped var AGENT_BOX_ENVIRONMENT, or edit the fallback.
    environment: ${{ vars.AGENT_BOX_ENVIRONMENT || 'defang-agent-box' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUCKET: ${{ vars.AGENT_BOX_BUCKET }}
      # Both templates ship from the same bucket: lightsail-template.yaml is
      # the default the README's Launch buttons point at, template.yaml is the
      # EC2 alternative. They pin agent-box differently — see the injection
      # step below.
      TEMPLATES: lightsail-template.yaml template.yaml
      ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Sanity-check required variables
        run: |
          missing=()
          [ -n "$BUCKET" ]   || missing+=("AGENT_BOX_BUCKET")
          [ -n "$ROLE_ARN" ] || missing+=("AWS_ROLE_ARN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo variable(s): ${missing[*]}. Set under Settings > Actions > Variables. See aws/README.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Validate templates locally
        run: |
          pip install --quiet cfn-lint
          cfn-lint aws/template.yaml aws/lightsail-template.yaml

      - name: Inject pinned defaults for the 1-click copies
        # The source templates deliberately ship without pinned values (see
        # the params' Descriptions): a source-template launch like
        # deploy-test then tracks the default branch / the base channel. The
        # 1-click Launch buttons want a reproducible box, so pinned values go
        # into the S3 COPIES only.
        #
        # The two templates pin agent-box by different means, so they get one
        # awk each:
        #   template.yaml (EC2)        fetches modules/agent-box.nix by rev +
        #                              hash, and pins nixpkgs for the agent
        #                              CLIs -> four Defaults.
        #   lightsail-template.yaml    installs the runtime profile from a
        #                              flake ref -> one Default.
        run: |
          rev="${{ github.sha }}"
          sha="sha256-$(curl -sSfL "https://raw.githubusercontent.com/${{ github.repository }}/${rev}/modules/agent-box.nix" \
            | openssl dgst -sha256 -binary | base64)"
          agentRelease="$(curl -fsSLo /dev/null -w '%{url_effective}' https://channels.nixos.org/nixos-unstable)"
          agentUrl="${agentRelease%/}/nixexprs.tar.xz"
          agentSha="$(nix-prefetch-url --unpack "$agentUrl")"
          flakeRef="github:${{ github.repository }}/${rev}"
          echo "Rev: $rev"
          echo "Sha: $sha"
          echo "AgentUrl: $agentUrl"
          echo "AgentSha: $agentSha"
          echo "FlakeRef: $flakeRef"

          awk -v rev="$rev" -v sha="$sha" -v agentUrl="$agentUrl" -v agentSha="$agentSha" '
            /^  AgentBoxRev:$/     { rf=1; print; next }
            rf && /^    Type:/      { print; print "    Default: " rev; rf=0; next }
            /^  AgentBoxSha256:$/  { sf=1; print; next }
            sf && /^    Type:/      { print; print "    Default: " sha; sf=0; next }
            /^  AgentNixpkgsUrl:$/   { sf2=1; print; next }
            sf2 && /^    Default:/    { print "    Default: " agentUrl; sf2=0; next }
            /^  AgentNixpkgsSha256:$/  { sf3=1; print; next }
            sf3 && /^    Default:/    { print "    Default: " agentSha; sf3=0; next }
            { print }
          ' aws/template.yaml > aws/filled-template.yaml
          for want in "$rev" "$sha" "$agentUrl" "$agentSha"; do
            if ! grep -qxF "    Default: $want" aws/filled-template.yaml; then
              echo "::error::Default injection failed for template.yaml — expected \"Default: $want\" not present in the filled template."
              diff aws/template.yaml aws/filled-template.yaml || true
              exit 1
            fi
          done

          awk -v ref="$flakeRef" '
            /^  AgentBoxFlakeRef:$/ { ff=1; print; next }
            ff && /^    Default:/    { print "    Default: " ref; ff=0; next }
            { print }
          ' aws/lightsail-template.yaml > aws/filled-lightsail-template.yaml
          if ! grep -qxF "    Default: $flakeRef" aws/filled-lightsail-template.yaml; then
            echo "::error::Default injection failed for lightsail-template.yaml — expected \"Default: $flakeRef\" not present in the filled template."
            diff aws/lightsail-template.yaml aws/filled-lightsail-template.yaml || true
            exit 1
          fi

          for t in $TEMPLATES; do
            cfn-lint "aws/filled-$t"
          done

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate templates with CloudFormation
        run: |
          for t in $TEMPLATES; do
            aws cloudformation validate-template --template-body "file://aws/filled-$t"
          done

      - name: Upsert bucket + public-read policy on the templates
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists."
          else
            echo "Creating bucket $BUCKET in $AWS_REGION..."
            # us-east-1 rejects LocationConstraint; other regions require it.
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          # Idempotent — always re-applied so drift can't leave the bucket private.
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=false,RestrictPublicBuckets=false'

          # Public-read on the two template objects only — CloudFormation's
          # Launch Stack UI requires an S3 URL for templateURL. The module
          # itself is fetched by the box direct from raw.githubusercontent.com
          # (dual-stack), so this bucket carries no other public assets. One
          # policy covers both objects (a single PutBucketPolicy replaces the
          # whole document, so the two templates must not fight over it).
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "$(cat <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadAgentBoxTemplate",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": [
                "arn:aws:s3:::${BUCKET}/lightsail-template.yaml",
                "arn:aws:s3:::${BUCKET}/template.yaml"
              ]
            }]
          }
          POLICY
          )"

      - name: Upload to S3
        run: |
          for t in $TEMPLATES; do
            aws s3 cp "aws/filled-$t" "s3://${BUCKET}/${t}" \
              --content-type "application/x-yaml" \
              --cache-control "no-cache, max-age=0"
            echo "::notice::Published to https://${BUCKET}.s3.amazonaws.com/${t}"
          done
