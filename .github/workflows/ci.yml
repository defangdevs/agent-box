name: CI

on:
  push:
    branches: [ master ]
    paths: &build-paths
      - '**.nix'
      # Sources of the generated modules/agent-box.nix (issue #140): a change
      # here can reassemble to the same bytes (a pure refactor), so it would
      # not touch a *.nix file — match them explicitly so the module-generated-
      # up-to-date guard (and the rest of CI) still runs.
      - 'modules/agent-box.nix.in'
      - 'modules/src/**'
      - 'bin/assemble-module.py'
      # Native test/validator edits must trigger the discovered checks too.
      - 'tests/**'
      - 'scripts/**'
      # Every workflow, not just this one: CI validates no other workflow's
      # YAML, so a file that cannot parse is simply never run and nothing
      # says so. PR #483 shipped exactly that — vendor-updates.yml had a
      # heredoc dedented out of its `run: |` block scalar, CI stayed green,
      # and the weekly job would have silently never fired.
      - '.github/workflows/**'
      # The native-render fixture (issue #154 Phase 4): the renderer under
      # test, the test itself, and its committed expected/ snapshot must all
      # re-run agentbox-render when any one changes, or a stale fixture only
      # surfaces via a manual dispatch (as it did for PR #381).
      - 'bin/agentbox'
      # The mascot mark (issue #185) is embedded into the settings daemon at
      # assemble time, so it is a module source as much as a website asset.
      - 'docs/potato.svg'
      # The golden behavior snapshot (issue #154): the fixture and its
      # renderer must re-run the golden-snapshot check when either changes.
      - 'bin/golden-snapshot.py'
      - 'flake.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *build-paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo — it builds and runs checks, some of them
# over pull-request-controlled Nix and Python. aws-ci.yml already declares
# this; CI was relying on the repository default.
permissions:
  contents: read

jobs:
  native:
    name: Native checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # All native checks, pinned workflow lint and both image eval gates.
      - name: Run native checks
        timeout-minutes: 12
        run: nix build -L --keep-going --max-jobs 4 --cores 1 --no-link .#ci-native

  vm:
    name: VM (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failed lane must not cancel the other regression results.
      fail-fast: false
      matrix:
        include:
          - lane: sessions
            jobs: 1
          - lane: webhook
            jobs: 1
          - lane: browser
            jobs: 1
          - lane: host
            jobs: 1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Only this lane's drivers are evaluated/built, with no guests running.
      - name: Prepare VM drivers
        timeout-minutes: 7
        run: nix build -L --keep-going --max-jobs 4 --cores 1 --out-link ci-drivers .#ci-vm-${{ matrix.lane }}
      - name: Enable KVM for the test driver
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Still four simultaneous test derivations per workflow run. Each test can
      # boot multiple guests; separate runners reduce contention per guest.
      - name: Run VM tests
        timeout-minutes: 12
        run: bash scripts/ci-vm-tests.sh ci-drivers ${{ matrix.jobs }}

  validate:
    # Preserve the existing status name and fail closed on failure, skip or
    # cancellation in ANY dependency. Measure the full workflow critical
    # path when assessing #519, not this short aggregation job in isolation.
    name: Validate module & VM
    needs: [native, vm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          VM_RESULT: ${{ needs.vm.result }}
        run: |
          echo "Native checks: $NATIVE_RESULT; VM lanes: $VM_RESULT"
          [[ "$NATIVE_RESULT" == success && "$VM_RESULT" == success ]]
