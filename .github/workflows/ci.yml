name: CI

on:
  # No `paths:` filter here, on purpose (issue #632). A trigger-level
  # filter means the workflow never STARTS on a change it does not match,
  # and a workflow that never starts reports no check run at all - so
  # requiring green CI in the branch ruleset would have left every
  # docs-only pull request pending forever on a check nothing would ever
  # report. The filter moved down a level, to
  # .github/path-filters/ci.paths, which the `changes` job below reads:
  # the workflow always starts, the expensive `native`/`vm` jobs are
  # skipped when nothing relevant changed, and the `gate` job at the
  # bottom reports success or failure either way. `gate` is the check to
  # require.
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo — it builds and runs checks, some of them
# over pull-request-controlled Nix and Python. aws-ci.yml already declares
# this; CI was relying on the repository default.
permissions:
  contents: read

jobs:
  # Cheap, always runs, and decides for the expensive jobs below. Its own
  # failure is a gate failure: "we could not work out whether the checks
  # were needed" must never read as "the checks passed".
  changes:
    name: Decide whether CI's build paths changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Both ends of the range have to be IN the clone. The default
          # depth-1 checkout has neither a pull request's base nor a
          # push's `before`, and changed_paths.py answers "true" rather
          # than guessing when the range is unreadable - correct, but it
          # would run the whole VM suite on every docs commit.
          fetch-depth: 0

      - name: Match the changed paths against the filter
        id: filter
        env:
          # HEAD for both events: on a pull request actions/checkout leaves
          # the MERGE commit checked out, whose merge base with base.sha is
          # base.sha itself, so `base...HEAD` is exactly the pull request's
          # own diff without needing the head commit to be present.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          answer=$(python3 scripts/changed_paths.py \
            .github/path-filters/ci.paths --base "$BASE" --head HEAD)
          echo "build=$answer" >> "$GITHUB_OUTPUT"
          echo "::notice::CI build paths changed: $answer"

  native:
    name: Native checks
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # All native checks, pinned workflow lint and both image eval gates.
      - name: Run native checks
        timeout-minutes: 12
        run: nix build -L --keep-going --max-jobs 4 --cores 1 --no-link .#ci-native

  vm:
    name: VM (${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failed lane must not cancel the other regression results.
      fail-fast: false
      matrix:
        include:
          - lane: sessions
            jobs: 1
          - lane: webhook
            jobs: 1
          - lane: browser
            jobs: 1
          - lane: host
            jobs: 1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Only this lane's drivers are evaluated/built, with no guests running.
      - name: Prepare VM drivers
        timeout-minutes: 7
        run: nix build -L --keep-going --max-jobs 4 --cores 1 --out-link ci-drivers .#ci-vm-${{ matrix.lane }}
      - name: Enable KVM for the test driver
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Still four simultaneous test derivations per workflow run. Each test can
      # boot multiple guests; separate runners reduce contention per guest.
      - name: Run VM tests
        timeout-minutes: 12
        run: bash scripts/ci-vm-tests.sh ci-drivers ${{ matrix.jobs }}

  # THE check to require in the branch ruleset (issue #632): reported on
  # every push and every pull request, whatever paths they touch, so it
  # can never be the required-but-never-reported check that makes a pull
  # request unmergeable. It reports what actually happened rather than
  # what ran - including the case a plain "did native/vm pass?" would get
  # wrong, where the guard expression skipped the job even though the
  # paths did change.
  gate:
    name: CI gate
    needs: [ changes, native, vm ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the aggregate CI result
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.native.result }}
          VM: ${{ needs.vm.result }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          echo "changes=$CHANGES build=$BUILD native=$NATIVE vm=$VM"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job did not succeed ($CHANGES), so nothing here knows whether CI was needed."
            exit 1
          fi

          check_job() {
            local name=$1 result=$2
            case "$result" in
              success)
                return 0
                ;;
              skipped)
                if [ "$BUILD" = "true" ]; then
                  echo "::error::the build paths changed but $name was skipped - the guard expression on that job is wrong."
                  exit 1
                fi
                return 0
                ;;
              *)
                echo "::error::$name did not pass ($result)."
                exit 1
                ;;
            esac
          }

          check_job native "$NATIVE"
          check_job vm "$VM"

          if [ "$BUILD" = "true" ]; then
            echo "CI passed."
          else
            echo "No build-relevant path changed; CI had nothing to run."
          fi
