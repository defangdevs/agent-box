name: Refresh NixOS AMIs

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC (offset to avoid GH's on-the-hour bursts)
  workflow_dispatch:

permissions:
  contents: write        # push the AMI-map bump to a branch and merge its PR
  pull-requests: write   # open + merge that PR (master requires PRs — ruleset 21491459)
  actions: write         # dispatch publish-template.yml (see "Publish the bump" below)

concurrency:
  group: refresh-amis
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate AMI map
        run: python3 scripts/refresh_amis.py

      - name: Commit if changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet aws/template.yaml; then
            echo "No AMI changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="chore/refresh-amis-${{ github.run_id }}"
          git checkout -b "$branch"
          git add aws/template.yaml
          git commit -m "Refresh NixOS AMI map (26.05)"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Refresh NixOS AMI map (26.05)" \
            --body "Automated weekly AMI map refresh."
          gh pr merge "$branch" --squash --delete-branch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # master's "Require conversation resolution" ruleset (21491459, added
      # 2026-08-25) rejects a direct push with GH013 — every change now has to
      # go through a PR. The step above opens one from a throwaway branch and
      # merges it immediately: the ruleset requires 0 approving reviews, so
      # nothing blocks a same-run merge, and this stays inside the same
      # trust boundary as before (GITHUB_TOKEN, own repo, generated content).
      #
      # Commits pushed (or merged) with GITHUB_TOKEN do not trigger workflows,
      # so neither the old direct push nor this merge fires publish-template.yml
      # (which watches pushes touching aws/template.yaml) — the refreshed AMI
      # map would stay on master and never reach the S3 template the 1-click
      # Launch buttons serve. That is not theoretical: 5542d8f (2026-07-06)
      # landed the only AMI bump so far, and there was no publish run for it in
      # 60 runs going back to 2026-07-04.
      #
      # Dispatching explicitly closes the loop while keeping this job on
      # GITHUB_TOKEN. The alternative — pushing under a PAT or GitHub App so the
      # push itself triggers downstream workflows — would also give the AMI bump
      # a review gate, but it re-enables workflow cascades for every job sharing
      # that identity. Not worth it for a job whose output is a generated map.
      #
      # publish-template.yml runs `cfn-lint aws/template.yaml` before uploading,
      # so the dispatched run validates the map it is about to publish.
      - name: Publish the bump
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-template.yml --ref "$GITHUB_REF_NAME"
