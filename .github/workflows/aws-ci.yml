name: AWS template CI

on:
  push:
    branches: [ master ]
    paths: &aws-ci-paths
      - 'deploy/aws/template.yaml'
      - 'deploy/aws/lightsail-template.yaml'
      - 'docs/index.html'
      - 'scripts/ws_smoke.py'
      - 'scripts/check_lightsail_userdata.py'
      - 'bin/agentbox'
      - 'tests/test_agentbox.py'
      - 'tests/native/**'
      - '.github/workflows/aws-ci.yml'
      - '.github/workflows/deploy-test.yml'
  pull_request:
    paths: *aws-ci-paths
  workflow_dispatch:

concurrency:
  group: aws-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate AWS template and smoke helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cfn-lint
        # pyyaml too: check_lightsail_userdata.py parses the config.yaml the
        # launch script writes, and it runs before the native-renderer step
        # that used to be the only thing here needing it.
        run: python3 -m pip install --quiet cfn-lint pyyaml

      - name: Validate CloudFormation templates
        run: |
          cfn-lint deploy/aws/template.yaml deploy/aws/lightsail-template.yaml

      # cfn-lint reads YAML, so it cannot see that Lightsail prepends its
      # own #!/bin/sh preamble and runs the launch script under dash — the
      # failure that kept the old infect-based 1-click from ever booting
      # (issue #390). The check discovers deploy/aws/lightsail*template.yaml
      # itself, so a new Lightsail template cannot slip past it unguarded.
      - name: Check the Lightsail launch-script shell dialect
        run: python3 scripts/check_lightsail_userdata.py

      - name: Run the native renderer's tests
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_agentbox.py

      - name: Compile WebSocket smoke helper
        run: python3 -m py_compile scripts/ws_smoke.py
